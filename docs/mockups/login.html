<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 뉴스레터 (시안)</title>
  <link rel="stylesheet" href="../../NewsletterApp/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="mockup.css">
</head>
<body class="guest-body">
  <div class="mock-bar"></div>

  <!-- 상태: 기본 -->
  <section data-state="기본">
    <div class="card guest-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="guest-title mb-4">뉴스레터 로그인</h1>
        <div class="mb-3">
          <input type="text" class="form-control" placeholder="아이디" maxlength="20">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="비밀번호" maxlength="20">
        </div>
        <a href="history.html" class="btn btn-primary w-100">로그인</a>
        <div class="d-flex justify-content-between mt-3">
          <a href="register.html">회원가입</a>
          <a href="password_reset.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 상태: 입력 누락 -->
  <section data-state="입력 누락">
    <div class="card guest-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="guest-title mb-4">뉴스레터 로그인</h1>
        <div class="mb-3">
          <input type="text" class="form-control is-invalid" placeholder="아이디" maxlength="20">
          <div class="invalid-feedback">아이디를 입력해 주세요.</div>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control is-invalid" placeholder="비밀번호" maxlength="20">
          <div class="invalid-feedback">비밀번호를 입력해 주세요.</div>
        </div>
        <button type="button" class="btn btn-primary w-100">로그인</button>
        <div class="d-flex justify-content-between mt-3">
          <a href="register.html">회원가입</a>
          <a href="password_reset.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 상태: 로딩 중 -->
  <section data-state="로딩 중">
    <div class="card guest-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="guest-title mb-4">뉴스레터 로그인</h1>
        <div class="mb-3">
          <input type="text" class="form-control" value="hong1234" maxlength="20">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" value="password" maxlength="20">
        </div>
        <button type="button" class="btn btn-primary w-100" disabled>
          <span class="spinner-border spinner-border-sm me-1"></span>로그인 중
        </button>
        <div class="d-flex justify-content-between mt-3">
          <a href="register.html">회원가입</a>
          <a href="password_reset.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 상태: 로그인 실패 -->
  <section data-state="로그인 실패">
    <div class="card guest-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="guest-title mb-4">뉴스레터 로그인</h1>
        <div class="alert alert-danger py-2">아이디 또는 비밀번호가 맞지 않습니다.</div>
        <div class="mb-3">
          <input type="text" class="form-control" value="hong1234" maxlength="20">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="비밀번호" maxlength="20">
        </div>
        <button type="button" class="btn btn-primary w-100">로그인</button>
        <div class="d-flex justify-content-between mt-3">
          <a href="register.html">회원가입</a>
          <a href="password_reset.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 상태: 로그인 잠금 -->
  <section data-state="로그인 잠금">
    <div class="card guest-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="guest-title mb-4">뉴스레터 로그인</h1>
        <div class="alert alert-danger py-2">로그인 시도가 많아 10분 뒤에 다시 시도해 주세요.</div>
        <div class="mb-3">
          <input type="text" class="form-control" value="hong1234" maxlength="20">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" placeholder="비밀번호" maxlength="20">
        </div>
        <button type="button" class="btn btn-primary w-100">로그인</button>
        <div class="d-flex justify-content-between mt-3">
          <a href="register.html">회원가입</a>
          <a href="password_reset.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </section>

  <!-- 상태: 오류 -->
  <section data-state="오류">
    <div class="card guest-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="guest-title mb-4">뉴스레터 로그인</h1>
        <div class="alert alert-danger py-2">일시적인 오류가 발생했습니다. 잠시 뒤에 다시 시도해 주세요.</div>
        <div class="mb-3">
          <input type="text" class="form-control" value="hong1234" maxlength="20">
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" value="password" maxlength="20">
        </div>
        <button type="button" class="btn btn-primary w-100">로그인</button>
        <div class="d-flex justify-content-between mt-3">
          <a href="register.html">회원가입</a>
          <a href="password_reset.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </section>

  <script src="mockup.js"></script>
</body>
</html>
